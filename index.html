<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nika Club — Сонглист</title>
  <style>
    :root {
      --bg: #0f0c11;
      --card: #19141d;
      --card-hover: #221b28;
      --border: #2e2436;
      --text: #f4eff7;
      --muted: #a699b0;
      --crimson: #e11d48;
      --crimson-soft: rgba(225, 29, 72, 0.16);
      --gold: #eab308;
      --gold-soft: rgba(234, 179, 8, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #1f1322 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.45;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }
    header {
      text-align: center;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 1.9rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      background: linear-gradient(135deg, #fff 20%, var(--gold) 85%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 4px;
    }
    .stats {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 14px;
    }
    .stat-badge {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .stat-badge strong { color: var(--gold); }
    .controls {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .search-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    input[type="search"], select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
    }
    input[type="search"] { flex: 1; min-width: 220px; }
    input[type="search"]:focus, select:focus { border-color: var(--crimson); }
    .btn {
      background: linear-gradient(135deg, var(--crimson), #be123c);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.98); }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chip {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .chip.active {
      background: var(--crimson-soft);
      border-color: var(--crimson);
      color: #fff;
    }
    .random-box {
      display: none;
      background: linear-gradient(135deg, rgba(225, 29, 72, 0.15), rgba(234, 179, 8, 0.12));
      border: 1px solid var(--gold);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 16px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .random-box.show { display: flex; }
    .status-msg {
      text-align: center;
      padding: 28px 16px;
      color: var(--muted);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
    }
    .error-banner {
      display: none;
      background: rgba(225, 29, 72, 0.15);
      border: 1px solid var(--crimson);
      color: #fecdd3;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-bottom: 14px;
    }
    .song-list {
      display: grid;
      gap: 8px;
    }
    .song-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      transition: background 0.15s;
    }
    .song-item:hover { background: var(--card-hover); }
    .song-main { min-width: 0; }
    .song-title {
      font-weight: 650;
      font-size: 0.98rem;
      color: var(--text);
      word-break: break-word;
    }
    .song-artist {
      color: var(--gold);
      font-size: 0.86rem;
      margin-top: 2px;
    }
    .song-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .tag {
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
    }
    .tag-ssl { background: var(--crimson-soft); color: #fda4af; }
    .tag-sheet { background: var(--gold-soft); color: #fde047; }
    .tag-plays { background: #261f2c; color: var(--muted); }
    @media (max-width: 600px) {
      .song-item { flex-direction: column; align-items: flex-start; }
      .song-meta { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Nika Club 🍓 Сонглист</h1>
      <p class="subtitle">Музыка от души — единый каталог песен Ники</p>
      <div class="stats" id="stats">
        <span class="stat-badge">Загрузка источников...</span>
      </div>
    </header>

    <div id="errorBanner" class="error-banner"></div>

    <div class="controls">
      <div class="search-row">
        <input type="search" id="searchInput" placeholder="Поиск по исполнителю или названию песни...">
        <select id="sortSelect">
          <option value="artist">Сортировка: Исполнитель (А–Я)</option>
          <option value="title">Сортировка: Песня (А–Я)</option>
          <option value="plays">Сортировка: Популярные</option>
        </select>
        <button class="btn" id="randomBtn" type="button">🎲 Случайная</button>
      </div>
      <div class="filters" id="filterChips">
        <button class="chip active" data-filter="all">Все песни</button>
        <button class="chip" data-filter="ssl">StreamerSongList</button>
        <button class="chip" data-filter="sheet">Google Таблица</button>
        <button class="chip" data-filter="both">В обоих списках</button>
        <button class="chip" data-filter="unplayed">Ещё не пелись</button>
      </div>
    </div>

    <div id="randomBox" class="random-box">
      <div>
        <div style="font-size:0.78rem;color:var(--gold);font-weight:600;">ВЫПАЛА ПЕСНЯ ДЛЯ ЗАКАЗА:</div>
        <div id="randomText" style="font-weight:700;font-size:1.05rem;margin-top:2px;"></div>
      </div>
      <button class="btn" id="copyRandomBtn" type="button">Скопировать</button>
    </div>

    <div id="listContainer" class="status-msg">Собираем и объединяем песни из StreamerSongList и Google Таблицы...</div>
  </div>

  <script>
    const STREAMER_NAME = 'nikaclub';
    const SHEET_ID = '1-ADetubVcKM3FZUtfURoKnuKE4NODFRcPlroKk5dvl8';
    const SHEET_GID = '0';

    let allSongs = [];
    let currentFilter = 'all';

    function norm(str) {
      return (str || '')
        .toLowerCase()
        .replace(/ё/g, 'е')
        .replace(/\(.*?\)|\[.*?\]/g, '')
        .replace(/[^a-zа-я0-9\s]/gi, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let cell = '';
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const next = text[i + 1];
        if (inQuotes) {
          if (ch === '"' && next === '"') {
            cell += '"';
            i++;
          } else if (ch === '"') {
            inQuotes = false;
          } else {
            cell += ch;
          }
        } else {
          if (ch === '"') {
            inQuotes = true;
          } else if (ch === ',') {
            row.push(cell.trim());
            cell = '';
          } else if (ch === '\r' && next === '\n') {
            row.push(cell.trim());
            rows.push(row);
            row = [];
            cell = '';
            i++;
          } else if (ch === '\n' || ch === '\r') {
            row.push(cell.trim());
            rows.push(row);
            row = [];
            cell = '';
          } else {
            cell += ch;
          }
        }
      }
      if (cell.length > 0 || row.length > 0) {
        row.push(cell.trim());
        rows.push(row);
      }
      return rows.filter(r => r.some(c => c !== ''));
    }

    async function fetchStreamerSongList() {
      const profileRes = await fetch(`https://api.streamersonglist.com/v1/streamers/${STREAMER_NAME}`);
      if (!profileRes.ok) throw new Error('Не удалось получить профиль StreamerSongList');
      const profile = await profileRes.json();
      const streamerId = profile.id;

      let items = [];
      let current = 0;
      const size = 250;
      while (true) {
        const res = await fetch(`https://api.streamersonglist.com/v1/streamers/${streamerId}/songs?size=${size}&current=${current}`);
        if (!res.ok) throw new Error('Ошибка загрузки списка песен StreamerSongList');
        const data = await res.json();
        const batch = data.items || [];
        items = items.concat(batch);
        if (items.length >= (data.total || batch.length) || batch.length === 0) break;
        current++;
      }

      return items.map(s => ({
        title: (s.title || '').trim(),
        artist: (s.artist || 'Неизвестный исполнитель').trim(),
        timesPlayed: Number(s.timesPlayed || 0),
        lastPlayed: s.lastPlayed || null,
        source: 'ssl'
      })).filter(s => s.title);
    }

    async function fetchGoogleSheet() {
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${SHEET_GID}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('Нет доступа к Google Таблице (проверьте доступ по ссылке)');
      const text = await res.text();
      if (text.trim().startsWith('<!DOCTYPE html')) {
        throw new Error('Google Таблица закрыта от публичного чтения — включите «Все, у кого есть ссылка»');
      }

      const rows = parseCSV(text);
      if (!rows.length) return [];

      let startIdx = 0;
      let artistCol = -1;
      let titleCol = -1;

      const header = rows[0].map(c => c.toLowerCase());
      header.forEach((h, idx) => {
        if (/(артист|исполнитель|artist|автор|группа)/.test(h)) artistCol = idx;
        if (/(песня|название|трек|title|song|композиция)/.test(h)) titleCol = idx;
      });

      if (artistCol !== -1 || titleCol !== -1) {
        startIdx = 1;
      }

      const songs = [];
      for (let i = startIdx; i < rows.length; i++) {
        const r = rows[i];
        let artist = '';
        let title = '';

        if (artistCol !== -1 && titleCol !== -1) {
          artist = r[artistCol] || '';
          title = r[titleCol] || '';
        } else {
          const nonEmpty = r.filter(c => c && !/^\d+$/.test(c));
          if (nonEmpty.length >= 2) {
            artist = nonEmpty[0];
            title = nonEmpty[1];
          } else if (nonEmpty.length === 1) {
            const parts = nonEmpty[0].split(/\s+[—–-]\s+/);
            if (parts.length >= 2) {
              artist = parts[0];
              title = parts.slice(1).join(' - ');
            } else {
              title = nonEmpty[0];
              artist = 'Из таблицы';
            }
          }
        }

        if (title) {
          songs.push({
            title: title.trim(),
            artist: (artist || 'Из таблицы').trim(),
            timesPlayed: 0,
            lastPlayed: null,
            source: 'sheet'
          });
        }
      }
      return songs;
    }

    function mergeSongs(sslSongs, sheetSongs) {
      const map = new Map();

      for (const s of sslSongs) {
        const key = `${norm(s.artist)}|${norm(s.title)}`;
        map.set(key, {
          title: s.title,
          artist: s.artist,
          timesPlayed: s.timesPlayed,
          lastPlayed: s.lastPlayed,
          inSsl: true,
          inSheet: false
        });
      }

      for (const s of sheetSongs) {
        const nArtist = norm(s.artist);
        const nTitle = norm(s.title);
        const directKey = `${nArtist}|${nTitle}`;
        const swappedKey = `${nTitle}|${nArtist}`;

        if (map.has(directKey)) {
          map.get(directKey).inSheet = true;
        } else if (map.has(swappedKey)) {
          map.get(swappedKey).inSheet = true;
        } else {
          map.set(directKey, {
            title: s.title,
            artist: s.artist,
            timesPlayed: 0,
            lastPlayed: null,
            inSsl: false,
            inSheet: true
          });
        }
      }

      return Array.from(map.values());
    }

    function render() {
      const query = norm(document.getElementById('searchInput').value);
      const sortBy = document.getElementById('sortSelect').value;

      let filtered = allSongs.filter(s => {
        if (currentFilter === 'ssl' && !s.inSsl) return false;
        if (currentFilter === 'sheet' && !s.inSheet) return false;
        if (currentFilter === 'both' && !(s.inSsl && s.inSheet)) return false;
        if (currentFilter === 'unplayed' && s.timesPlayed > 0) return false;
        if (query) {
          const hay = `${norm(s.artist)} ${norm(s.title)}`;
          if (!hay.includes(query)) return false;
        }
        return true;
      });

      filtered.sort((a, b) => {
        if (sortBy === 'plays') {
          return b.timesPlayed - a.timesPlayed || a.artist.localeCompare(b.artist, 'ru');
        }
        if (sortBy === 'title') {
          return a.title.localeCompare(b.title, 'ru') || a.artist.localeCompare(b.artist, 'ru');
        }
        return a.artist.localeCompare(b.artist, 'ru') || a.title.localeCompare(b.title, 'ru');
      });

      const container = document.getElementById('listContainer');
      if (!filtered.length) {
        container.className = 'status-msg';
        container.textContent = 'По вашему запросу песен не найдено.';
        return;
      }

      container.className = 'song-list';
      container.innerHTML = filtered.map(s => `
        <div class="song-item">
          <div class="song-main">
            <div class="song-title">${escapeHtml(s.title)}</div>
            <div class="song-artist">${escapeHtml(s.artist)}</div>
          </div>
          <div class="song-meta">
            ${s.inSsl ? '<span class="tag tag-ssl">SSL</span>' : ''}
            ${s.inSheet ? '<span class="tag tag-sheet">Таблица</span>' : ''}
            ${s.timesPlayed > 0 ? `<span class="tag tag-plays">Пела: ${s.timesPlayed}</span>` : ''}
          </div>
        </div>
      `).join('');
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    async function init() {
      const errors = [];
      let sslSongs = [];
      let sheetSongs = [];

      const [sslRes, sheetRes] = await Promise.allSettled([
        fetchStreamerSongList(),
        fetchGoogleSheet()
      ]);

      if (sslRes.status === 'fulfilled') {
        sslSongs = sslRes.value;
      } else {
        errors.push(`StreamerSongList: ${sslRes.reason.message}`);
      }

      if (sheetRes.status === 'fulfilled') {
        sheetSongs = sheetRes.value;
      } else {
        errors.push(`Google Таблица: ${sheetRes.reason.message}`);
      }

      if (errors.length) {
        const banner = document.getElementById('errorBanner');
        banner.style.display = 'block';
        banner.textContent = errors.join(' | ');
      }

      allSongs = mergeSongs(sslSongs, sheetSongs);

      document.getElementById('stats').innerHTML = `
        <span class="stat-badge">Всего уникальных: <strong>${allSongs.length}</strong></span>
        <span class="stat-badge">StreamerSongList: <strong>${sslSongs.length}</strong></span>
        <span class="stat-badge">Google Таблица: <strong>${sheetSongs.length}</strong></span>
      `;

      render();
    }

    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('sortSelect').addEventListener('change', render);

    document.getElementById('filterChips').addEventListener('click', e => {
      if (!e.target.classList.contains('chip')) return;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      e.target.classList.add('active');
      currentFilter = e.target.dataset.filter;
      render();
    });

    document.getElementById('randomBtn').addEventListener('click', () => {
      if (!allSongs.length) return;
      const pick = allSongs[Math.floor(Math.random() * allSongs.length)];
      const text = `${pick.artist} — ${pick.title}`;
      document.getElementById('randomText').textContent = text;
      document.getElementById('randomBox').classList.add('show');
    });

    document.getElementById('copyRandomBtn').addEventListener('click', () => {
      const text = document.getElementById('randomText').textContent;
      navigator.clipboard?.writeText(text);
      document.getElementById('copyRandomBtn').textContent = 'Скопировано!';
      setTimeout(() => {
        document.getElementById('copyRandomBtn').textContent = 'Скопировать';
      }, 1500);
    });

    init();
  </script>
</body>
</html>
