<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nika Club — Сонглист</title>
  <style>
    :root {
      --bg: #0f0c11;
      --card: #19141d;
      --card-hover: #221b28;
      --border: #2e2436;
      --text: #f4eff7;
      --muted: #a699b0;
      --crimson: #e11d48;
      --crimson-soft: rgba(225, 29, 72, 0.16);
      --gold: #eab308;
      --gold-soft: rgba(234, 179, 8, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #1f1322 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.45;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }
    header {
      text-align: center;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 1.9rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      background: linear-gradient(135deg, #fff 20%, var(--gold) 85%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 4px;
    }
    .stats {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 14px;
    }
    .stat-badge {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .stat-badge strong { color: var(--gold); }
    .controls {
      background: var(--card);
      border: 1.5px solid #e9b5ff;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 16px;
      box-shadow: 0 0 10px rgba(216, 167, 255, 0.35), inset 0 0 6px rgba(233, 181, 255, 0.12);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .search-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    input[type="search"], select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
    }
    input[type="search"] { flex: 1; min-width: 220px; }
    input[type="search"]:focus, select:focus { border-color: var(--crimson); }
    .btn {
      background: linear-gradient(135deg, var(--crimson), #be123c);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.98); }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chip {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .chip.active {
      background: var(--crimson-soft);
      border-color: var(--crimson);
      color: #fff;
    }
    .random-box {
      display: none;
      background: linear-gradient(135deg, rgba(225, 29, 72, 0.15), rgba(234, 179, 8, 0.12));
      border: 1px solid var(--gold);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 16px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .random-box.show { display: flex; }
    .status-msg {
      text-align: center;
      padding: 28px 16px;
      color: var(--muted);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
    }
    .error-banner {
      display: none;
      background: rgba(225, 29, 72, 0.15);
      border: 1px solid var(--crimson);
      color: #fecdd3;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-bottom: 14px;
    }
    .song-list {
      display: grid;
      gap: 8px;
    }
    .song-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      transition: background 0.15s;
    }
    .song-item:hover { background: var(--card-hover); }
    .song-main { min-width: 0; }
    .song-title {
      font-weight: 650;
      font-size: 0.98rem;
      color: var(--text);
      word-break: break-word;
    }
    .song-artist {
      color: var(--gold);
      font-size: 0.86rem;
      margin-top: 2px;
    }
    .song-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .tag {
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
    }
    .tag-ssl { background: var(--crimson-soft); color: #fda4af; }
    .tag-sheet { background: var(--gold-soft); color: #fde047; }
    .tag-plays { background: #261f2c; color: var(--muted); }
    @media (max-width: 600px) {
      .song-item { flex-direction: column; align-items: flex-start; }
      .song-meta { justify-content: flex-start; }
    }
  
    .donate-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: flex-end;
    }
    .donate-btn {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      color: #fff;
      background: #2c2438;
      border: 1px solid rgba(255, 255, 255, 0.14);
      transition: transform 0.12s ease, filter 0.12s ease;
    }
    .donate-btn:hover {
      filter: brightness(1.15);
      transform: translateY(-1px);
    }
    .donate-da { background: #6b21a8; }
    .donate-dp { background: #9d174d; }
    .donate-ds { background: #1d4ed8; }

  
    .song-item {
      border: 1.5px solid #e9b5ff !important;
      box-shadow: 0 0 10px rgba(216, 167, 255, 0.35), inset 0 0 6px rgba(233, 181, 255, 0.12);
    }
    .song-item {
      border: 1.5px solid #e9b5ff !important;
      box-shadow: 0 0 10px rgba(216, 167, 255, 0.35), inset 0 0 6px rgba(233, 181, 255, 0.12);
    }
    .song-copy-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex: 1 1 auto;
      min-width: 0;
    }
    .copy-song-btn {
      width: 38px;
      height: 38px;
      min-width: 38px;
      flex: 0 0 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      border: 1.5px solid rgba(233, 181, 255, 0.75);
      background: rgba(233, 181, 255, 0.12);
      color: #f3d5ff;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }
    .copy-song-btn:hover {
      background: rgba(233, 181, 255, 0.24);
      transform: translateY(-1px);
    }
    .copy-song-btn.copied {
      border-color: #6ee7b7;
      background: rgba(16, 185, 129, 0.25);
      color: #a7f3d0;
    }
    .copy-toast {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%) translateY(12px);
      background: #14262b;
      color: #99f6e4;
      border: 1px solid rgba(45, 212, 191, 0.65);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
      z-index: 9999;
      max-width: 90vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .copy-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Nika Club 🍓 Сонглист</h1>
      <p class="subtitle">Музыка от души — единый каталог песен Ники</p>
      <div class="stats" id="stats">
        <span class="stat-badge">Загрузка каталога...</span>
      </div>
    </header>

    <div id="errorBanner" class="error-banner"></div>

    <div class="controls">
      <div class="search-row">
        <input type="search" id="searchInput" placeholder="Поиск по исполнителю или названию песни...">
        <select id="sortSelect">
          <option value="artist">Сортировка: Исполнитель (А–Я)</option>
          <option value="title">Сортировка: Песня (А–Я)</option>
          <option value="plays">Сортировка: Популярные</option>
        </select>
        <button class="btn" id="randomBtn" type="button">🎲 Случайная</button>
      </div>
      <div class="filters" id="filterChips">
        <button class="chip active" data-filter="all">Все песни</button>
        <button class="chip" data-filter="author">Авторские</button>
        <button class="chip" data-filter="russian">Российские</button>
        <button class="chip" data-filter="foreign">Иностранные</button>
        <button class="chip" data-filter="movies">Из фильмов</button>
        <button class="chip" data-filter="cartoons">Из мультфильмов</button>
      </div>
    </div>

    <div id="randomBox" class="random-box">
      <div>
        <div style="font-size:0.78rem;color:var(--gold);font-weight:600;">ВЫПАЛА ПЕСНЯ ДЛЯ ЗАКАЗА:</div>
        <div id="randomText" style="font-weight:700;font-size:1.05rem;margin-top:2px;"></div>
      </div>
      <button class="btn" id="copyRandomBtn" type="button">Скопировать</button>
    </div>

    <div id="listContainer" class="status-msg">Загружаем объединенный список песен...</div>
  </div>

  <script>
    let allSongs = [];
    let currentFilter = 'all';

    function norm(str) {
      return (str || '')
        .toLowerCase()
        .replace(/ё/g, 'е')
        .replace(/\(.*?\)|\[.*?\]/g, '')
        .replace(/[^a-zа-я0-9\s]/gi, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    function render() {
      const query = norm(document.getElementById('searchInput').value);
      const sortBy = document.getElementById('sortSelect').value;

      let filtered = allSongs.filter(s => {
        const rawFull = `${s.artist || ''} ${s.title || ''}`.toLowerCase();
        const artistLow = (s.artist || '').toLowerCase();
        const titleLow = (s.title || '').toLowerCase();

        const isAuthor = /(ника\s*моисеева|nika\s*moiseeva|авторск)/i.test(rawFull) || /^ника$/i.test(artistLow.trim());
        const isCartoon = /(из\s*м\/ф|м\/ф|из\s*мультфильм|мультфильм|disney|дисней|бременские музыканты|чебурашка|крокодил гена|винни[\s-]*пух|ну,?\s*погоди|простоквашино|леопольд|мамонтенок|мамонтёнок|ундина|русалочка|холодное сердце|король лев|король лев|аладдин)/i.test(rawFull);
        const isMovie = !isCartoon && /(из\s*к\/ф|к\/ф|из\s*т\/ф|т\/ф|из\s*фильм|из\s*сериал|саундтрек|ost)/i.test(rawFull);
        const hasCyrillic = /[а-яё]/i.test(`${titleLow} ${artistLow}`);

        if (currentFilter === 'author' && !isAuthor) return false;
        if (currentFilter === 'cartoons' && !isCartoon) return false;
        if (currentFilter === 'movies' && !isMovie) return false;
        if (currentFilter === 'russian' && !hasCyrillic) return false;
        if (currentFilter === 'foreign' && hasCyrillic) return false;

        if (query) {
          const hay = `${norm(s.artist)} ${norm(s.title)}`;
          if (!hay.includes(query)) return false;
        }
        return true;
      });

      filtered.sort((a, b) => {
        if (sortBy === 'plays') {
          return (b.timesPlayed || 0) - (a.timesPlayed || 0) || a.artist.localeCompare(b.artist, 'ru');
        }
        if (sortBy === 'title') {
          return a.title.localeCompare(b.title, 'ru') || a.artist.localeCompare(b.artist, 'ru');
        }
        return a.artist.localeCompare(b.artist, 'ru') || a.title.localeCompare(b.title, 'ru');
      });

      const container = document.getElementById('listContainer');
      if (!filtered.length) {
        container.className = 'status-msg';
        container.textContent = allSongs.length
          ? 'По вашему запросу песен не найдено.'
          : 'Каталог пока формируется. Запустите workflow "Update Songs Catalog" во вкладке Actions на GitHub.';
        return;
      }

      container.className = 'song-list';
      container.innerHTML = filtered.map(s => `
        <div class="song-item">
          <div class="song-copy-group">
            <div class="song-main">
              <div class="song-title">${escapeHtml(s.title)}</div>
              <div class="song-artist">${escapeHtml(s.artist)}</div>
            </div>
            <button
              type="button"
              class="copy-song-btn"
              title="Скопировать исполнителя и название"
              aria-label="Скопировать исполнителя и название"
              data-copy-text="${escapeHtml(`${s.artist} — ${s.title}`)}"
              onclick="copySongText(this)"
            >
              <svg class="copy-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 3h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-1"></path>
                <rect x="5" y="7" width="11" height="14" rx="2" ry="2"></rect>
              </svg>
              <svg class="check-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </button>
          </div>
          <div class="song-meta donate-actions">
            <a class="donate-btn donate-da" href="https://www.donationalerts.com/r/nikaclub" target="_blank" rel="noopener noreferrer">DonationAlerts</a>
            <a class="donate-btn donate-dp" href="https://new.donatepay.ru/@nikamoiseeva" target="_blank" rel="noopener noreferrer">DonatePay</a>
            <a class="donate-btn donate-ds" href="https://destream.net/live/nikaclub/donatee" target="_blank" rel="noopener noreferrer">Destream</a>
          </div>
        </div>
      `).join('');
    }

    async function init() {
      try {
        const res = await fetch(`./songs.json?v=${Date.now()}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        allSongs = data.songs || [];

        document.getElementById('stats').innerHTML = `
          <span class="stat-badge">Всего уникальных: <strong>${data.totalUnique ?? allSongs.length}</strong></span>
          <span class="stat-badge">StreamerSongList: <strong>${data.sslCount ?? 0}</strong></span>
          <span class="stat-badge">Google Таблица: <strong>${data.sheetCount ?? 0}</strong></span>
        `;
      } catch (err) {
        const banner = document.getElementById('errorBanner');
        banner.style.display = 'block';
        banner.textContent = `Не удалось загрузить songs.json (${err.message}). Запустите workflow в разделе Actions на GitHub.`;
      }
      render();
    }

    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('sortSelect').addEventListener('change', render);

    document.getElementById('filterChips').addEventListener('click', e => {
      if (!e.target.classList.contains('chip')) return;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      e.target.classList.add('active');
      currentFilter = e.target.dataset.filter;
      render();
    });

    document.getElementById('randomBtn').addEventListener('click', () => {
      if (!allSongs.length) return;
      const pick = allSongs[Math.floor(Math.random() * allSongs.length)];
      const text = `${pick.artist} — ${pick.title}`;
      document.getElementById('randomText').textContent = text;
      document.getElementById('randomBox').classList.add('show');
    });

    document.getElementById('copyRandomBtn').addEventListener('click', () => {
      const text = document.getElementById('randomText').textContent;
      navigator.clipboard?.writeText(text);
      document.getElementById('copyRandomBtn').textContent = 'Скопировано!';
      setTimeout(() => {
        document.getElementById('copyRandomBtn').textContent = 'Скопировать';
      }, 1500);
    });

    init();
  
    let toastTimer = null;
    function showCopyToast(msg) {
      let el = document.getElementById('copyToast');
      if (!el) {
        el = document.createElement('div');
        el.id = 'copyToast';
        el.className = 'copy-toast';
        document.body.appendChild(el);
      }
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
    }

    async function copySongText(btn) {
      const text = btn.getAttribute('data-copy-text') || '';
      if (!text) return;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
        } else {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        }
      } catch (_) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }

      const copyIcon = btn.querySelector('.copy-icon');
      const checkIcon = btn.querySelector('.check-icon');
      btn.classList.add('copied');
      if (copyIcon) copyIcon.style.display = 'none';
      if (checkIcon) checkIcon.style.display = 'block';
      showCopyToast(`Скопировано: ${text}`);

      setTimeout(() => {
        btn.classList.remove('copied');
        if (copyIcon) copyIcon.style.display = 'block';
        if (checkIcon) checkIcon.style.display = 'none';
      }, 1400);
    }

  </script>
</body>
</html>
