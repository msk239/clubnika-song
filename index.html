<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nika Club — Сонглист</title>
  <style>
    :root {
      --bg: #0f0c11;
      --card: #19141d;
      --card-hover: #221b28;
      --border: #2e2436;
      --text: #f4eff7;
      --muted: #a699b0;
      --crimson: #e11d48;
      --crimson-soft: rgba(225, 29, 72, 0.16);
      --gold: #eab308;
      --gold-soft: rgba(234, 179, 8, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #1f1322 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.45;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }
    header {
      text-align: center;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 1.9rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      background: linear-gradient(135deg, #fff 20%, var(--gold) 85%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 4px;
    }
    .stats {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 14px;
    }
    .stat-badge {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .stat-badge strong { color: var(--gold); }
    .controls {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .search-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    input[type="search"], select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
    }
    input[type="search"] { flex: 1; min-width: 220px; }
    input[type="search"]:focus, select:focus { border-color: var(--crimson); }
    .btn {
      background: linear-gradient(135deg, var(--crimson), #be123c);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.98); }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chip {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .chip.active {
      background: var(--crimson-soft);
      border-color: var(--crimson);
      color: #fff;
    }
    .random-box {
      display: none;
      background: linear-gradient(135deg, rgba(225, 29, 72, 0.15), rgba(234, 179, 8, 0.12));
      border: 1px solid var(--gold);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 16px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .random-box.show { display: flex; }
    .status-msg {
      text-align: center;
      padding: 28px 16px;
      color: var(--muted);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
    }
    .error-banner {
      display: none;
      background: rgba(225, 29, 72, 0.15);
      border: 1px solid var(--crimson);
      color: #fecdd3;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-bottom: 14px;
    }
    .song-list {
      display: grid;
      gap: 8px;
    }
    .song-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      transition: background 0.15s;
    }
    .song-item:hover { background: var(--card-hover); }
    .song-main { min-width: 0; }
    .song-title {
      font-weight: 650;
      font-size: 0.98rem;
      color: var(--text);
      word-break: break-word;
    }
    .song-artist {
      color: var(--gold);
      font-size: 0.86rem;
      margin-top: 2px;
    }
    .song-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .tag {
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
    }
    .tag-ssl { background: var(--crimson-soft); color: #fda4af; }
    .tag-sheet { background: var(--gold-soft); color: #fde047; }
    .tag-plays { background: #261f2c; color: var(--muted); }
    @media (max-width: 600px) {
      .song-item { flex-direction: column; align-items: flex-start; }
      .song-meta { justify-content: flex-start; }
    }
  
    .donate-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: flex-end;
    }
    .donate-btn {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      color: #fff;
      background: #2c2438;
      border: 1px solid rgba(255, 255, 255, 0.14);
      transition: transform 0.12s ease, filter 0.12s ease;
    }
    .donate-btn:hover {
      filter: brightness(1.15);
      transform: translateY(-1px);
    }
    .donate-da { background: #6b21a8; }
    .donate-dp { background: #9d174d; }
    .donate-ds { background: #1d4ed8; }

  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Nika Club 🍓 Сонглист</h1>
      <p class="subtitle">Музыка от души — единый каталог песен Ники</p>
      <div class="stats" id="stats">
        <span class="stat-badge">Загрузка каталога...</span>
      </div>
    </header>

    <div id="errorBanner" class="error-banner"></div>

    <div class="controls">
      <div class="search-row">
        <input type="search" id="searchInput" placeholder="Поиск по исполнителю или названию песни...">
        <select id="sortSelect">
          <option value="artist">Сортировка: Исполнитель (А–Я)</option>
          <option value="title">Сортировка: Песня (А–Я)</option>
          <option value="plays">Сортировка: Популярные</option>
        </select>
        <button class="btn" id="randomBtn" type="button">🎲 Случайная</button>
      </div>
      <div class="filters" id="filterChips">
        <button class="chip active" data-filter="all">Все песни</button>
        <button class="chip" data-filter="ssl">StreamerSongList</button>
        <button class="chip" data-filter="sheet">Google Таблица</button>
        <button class="chip" data-filter="both">В обоих списках</button>
        <button class="chip" data-filter="unplayed">Ещё не пелись</button>
      </div>
    </div>

    <div id="randomBox" class="random-box">
      <div>
        <div style="font-size:0.78rem;color:var(--gold);font-weight:600;">ВЫПАЛА ПЕСНЯ ДЛЯ ЗАКАЗА:</div>
        <div id="randomText" style="font-weight:700;font-size:1.05rem;margin-top:2px;"></div>
      </div>
      <button class="btn" id="copyRandomBtn" type="button">Скопировать</button>
    </div>

    <div id="listContainer" class="status-msg">Загружаем объединенный список песен...</div>
  </div>

  <script>
    let allSongs = [];
    let currentFilter = 'all';

    function norm(str) {
      return (str || '')
        .toLowerCase()
        .replace(/ё/g, 'е')
        .replace(/\(.*?\)|\[.*?\]/g, '')
        .replace(/[^a-zа-я0-9\s]/gi, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    function render() {
      const query = norm(document.getElementById('searchInput').value);
      const sortBy = document.getElementById('sortSelect').value;

      let filtered = allSongs.filter(s => {
        if (currentFilter === 'ssl' && !s.inSsl) return false;
        if (currentFilter === 'sheet' && !s.inSheet) return false;
        if (currentFilter === 'both' && !(s.inSsl && s.inSheet)) return false;
        if (currentFilter === 'unplayed' && (s.timesPlayed || 0) > 0) return false;
        if (query) {
          const hay = `${norm(s.artist)} ${norm(s.title)}`;
          if (!hay.includes(query)) return false;
        }
        return true;
      });

      filtered.sort((a, b) => {
        if (sortBy === 'plays') {
          return (b.timesPlayed || 0) - (a.timesPlayed || 0) || a.artist.localeCompare(b.artist, 'ru');
        }
        if (sortBy === 'title') {
          return a.title.localeCompare(b.title, 'ru') || a.artist.localeCompare(b.artist, 'ru');
        }
        return a.artist.localeCompare(b.artist, 'ru') || a.title.localeCompare(b.title, 'ru');
      });

      const container = document.getElementById('listContainer');
      if (!filtered.length) {
        container.className = 'status-msg';
        container.textContent = allSongs.length
          ? 'По вашему запросу песен не найдено.'
          : 'Каталог пока формируется. Запустите workflow "Update Songs Catalog" во вкладке Actions на GitHub.';
        return;
      }

      container.className = 'song-list';
      container.innerHTML = filtered.map(s => `
        <div class="song-item">
          <div class="song-main">
            <div class="song-title">${escapeHtml(s.title)}</div>
            <div class="song-artist">${escapeHtml(s.artist)}</div>
          </div>
          <div class="song-meta donate-actions">
            <a class="donate-btn donate-da" href="https://www.donationalerts.com/r/nikaclub" target="_blank" rel="noopener noreferrer">DonationAlerts</a>
            <a class="donate-btn donate-dp" href="https://new.donatepay.ru/@nikamoiseeva" target="_blank" rel="noopener noreferrer">DonatePay</a>
            <a class="donate-btn donate-ds" href="https://destream.net/live/nikaclub/donatee" target="_blank" rel="noopener noreferrer">Destream</a>
          </div>
        </div>
      `).join('');
    }

    async function init() {
      try {
        const res = await fetch(`./songs.json?v=${Date.now()}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        allSongs = data.songs || [];

        document.getElementById('stats').innerHTML = `
          <span class="stat-badge">Всего уникальных: <strong>${data.totalUnique ?? allSongs.length}</strong></span>
          <span class="stat-badge">StreamerSongList: <strong>${data.sslCount ?? 0}</strong></span>
          <span class="stat-badge">Google Таблица: <strong>${data.sheetCount ?? 0}</strong></span>
        `;
      } catch (err) {
        const banner = document.getElementById('errorBanner');
        banner.style.display = 'block';
        banner.textContent = `Не удалось загрузить songs.json (${err.message}). Запустите workflow в разделе Actions на GitHub.`;
      }
      render();
    }

    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('sortSelect').addEventListener('change', render);

    document.getElementById('filterChips').addEventListener('click', e => {
      if (!e.target.classList.contains('chip')) return;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      e.target.classList.add('active');
      currentFilter = e.target.dataset.filter;
      render();
    });

    document.getElementById('randomBtn').addEventListener('click', () => {
      if (!allSongs.length) return;
      const pick = allSongs[Math.floor(Math.random() * allSongs.length)];
      const text = `${pick.artist} — ${pick.title}`;
      document.getElementById('randomText').textContent = text;
      document.getElementById('randomBox').classList.add('show');
    });

    document.getElementById('copyRandomBtn').addEventListener('click', () => {
      const text = document.getElementById('randomText').textContent;
      navigator.clipboard?.writeText(text);
      document.getElementById('copyRandomBtn').textContent = 'Скопировано!';
      setTimeout(() => {
        document.getElementById('copyRandomBtn').textContent = 'Скопировать';
      }, 1500);
    });

    init();
  </script>
</body>
</html>
