name: Update Remixers Stats

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-remixers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install yt-dlp
        run: pip install -U yt-dlp

      - name: Run update_remixers.py
        run: python3 update_remixers.py

      - name: Commit and push if remixers.json changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add remixers.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update remixers.json"
            git push origin main
          else
            echo "No changes in remixers.json"
          fi
