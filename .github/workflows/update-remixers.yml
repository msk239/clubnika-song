name: Update Remixers Stats

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-remixers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run update_remixers.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 update_remixers.py

      - name: Run channel_analytics.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 channel_analytics.py

      - name: Commit and push if stats changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add remixers.json channel_analytics.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update remixers.json and channel_analytics.json"
            git push origin main
          else
            echo "No changes in stats files"
          fi
